<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-Нолики</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;min-height:100vh;display:flex;justify-content:center;align-items:center}
        .container{background:#16213e;padding:30px;border-radius:16px;text-align:center;color:#eee;width:360px}
        h1{margin-bottom:10px;color:#e94560}
        .status{margin:10px 0;padding:10px;background:#0f3460;border-radius:8px;min-height:40px;display:flex;align-items:center;justify-content:center}
        .board{display:grid;grid-template-columns:repeat(3,100px);grid-template-rows:repeat(3,100px);gap:6px;margin:20px auto;justify-content:center}
        .cell{background:#0f3460;border:none;border-radius:12px;font-size:48px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .cell.x{color:#e94560}.cell.o{color:#0ea5e9}.cell:disabled{opacity:0.7}
        .controls{margin-top:15px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
        button{padding:10px 16px;border:none;border-radius:8px;font-size:14px;cursor:pointer;background:#e94560;color:#fff}
        button.secondary{background:#0f3460}
        input{padding:10px;border-radius:8px;border:2px solid #0f3460;background:#1a1a2e;color:#fff;text-align:center;width:120px}
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Крестики-Нолики</h1>
        <div class="status" id="status">Введите ID и нажмите Войти</div>
        <div class="board" id="board"></div>
        <div class="controls">
            <input id="roomInput" placeholder="ID комнаты" maxlength="10">
            <button onclick="joinGame()">Войти</button>
            <button onclick="resetGame()" class="secondary">Сброс</button>
        </div>
    </div>
    <script>
        const WS_SERVER = 'wss://e0809ae053fbd9.lhr.life';
        let board = Array(9).fill(null), mySymbol = null, currentTurn = 'X', ws = null, roomId = null, gameActive = false;
        const statusEl = document.getElementById('status'), boardEl = document.getElementById('board'), roomInput = document.getElementById('roomInput');
        function setStatus(t) { statusEl.textContent = t; }
        function joinGame() { const id = roomInput.value.trim(); if (!id) return setStatus('Введите ID комнаты'); roomId = id; connectAndJoin(); }
        function connectAndJoin() { setStatus('Подключение...'); ws = new WebSocket(WS_SERVER); ws.onopen = () => ws.send(JSON.stringify({ type: 'join', room: roomId }));
            ws.onmessage = (e) => { const m = JSON.parse(e.data);
                if (m.type === 'player_joined') { mySymbol = m.symbol; setStatus('Вы ' + mySymbol + '. Ожидание соперника...'); }
                if (m.type === 'game_start') { board = m.board; currentTurn = m.currentTurn; gameActive = true; renderBoard(); setStatus(mySymbol === 'X' ? 'Ваш ход (X)' : 'Ход соперника (X)'); }
                if (m.type === 'move' || m.type === 'move_made') { board[m.index] = m.symbol; currentTurn = m.nextTurn || (m.symbol === 'X' ? 'O' : 'X'); renderBoard(); const w = checkWinner(); if (w) { gameActive = false; setStatus(w === mySymbol ? '🎉 Победа!' : '😢 Поражение...'); } else if (board.every(c => c !== null)) { gameActive = false; setStatus('🤝 Ничья!'); } else setStatus(currentTurn === mySymbol ? 'Ваш ход' : 'Ход соперника'); }
                if (m.type === 'reset' || m.type === 'game_reset') { board = Array(9).fill(null); currentTurn = 'X'; gameActive = true; renderBoard(); setStatus(mySymbol === 'X' ? 'Ваш ход (X)' : 'Ход соперника (X)'); }
                if (m.type === 'player_left') { gameActive = false; setStatus('Соперник отключился'); }
            };
            ws.onclose = () => { setStatus('Соединение потеряно'); gameActive = false; };
        }
        function makeMove(i) { if (!gameActive || currentTurn !== mySymbol || board[i] !== null) return; board[i] = mySymbol; const n = mySymbol === 'X' ? 'O' : 'X'; currentTurn = n; renderBoard(); ws.send(JSON.stringify({ type: 'move', room: roomId, index: i, symbol: mySymbol, nextTurn: n })); const w = checkWinner(); if (w) { gameActive = false; setStatus(w === mySymbol ? '🎉 Победа!' : '😢 Поражение...'); } else if (board.every(c => c !== null)) { gameActive = false; setStatus('🤝 Ничья!'); } else setStatus('Ход соперника'); }
        function resetGame() { board = Array(9).fill(null); currentTurn = 'X'; gameActive = true; renderBoard(); ws.send(JSON.stringify({ type: 'reset', room: roomId })); setStatus(mySymbol === 'X' ? 'Ваш ход (X)' : 'Ход соперника (X)'); }
        function checkWinner() { const l = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; for (const [a,b,c] of l) if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a]; return null; }
        function renderBoard() { boardEl.innerHTML = ''; for (let i = 0; i < 9; i++) { const c = document.createElement('button'); c.className = 'cell'; if (board[i]) { c.textContent = board[i]; c.classList.add(board[i].toLowerCase()); c.disabled = true; } c.onclick = () => makeMove(i); boardEl.appendChild(c); } }
        renderBoard();
    </script>
</body>
</html>
